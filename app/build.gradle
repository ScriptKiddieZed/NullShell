plugins { id 'com.android.application' }

android {
    namespace 'com.zed.nullshell'
    compileSdk 36

    defaultConfig {
        applicationId 'com.zed.nullshell'
        minSdk 26
        targetSdk 36
        versionCode 49
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// sora-editor (https://github.com/Rosemoe/sora-editor, LGPL-2.1). All artifacts must use the same version.
// If Gradle cannot resolve this version, look up the newest one at https://central.sonatype.com/search?q=io.github.rosemoe
def soraVersion = '0.24.6'

dependencies {
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.12'

    implementation "io.github.rosemoe:editor:$soraVersion"
    implementation "io.github.rosemoe:language-textmate:$soraVersion"
    implementation "io.github.rosemoe:oniguruma-native:$soraVersion"   // native regex engine the TextMate module needs at runtime
    implementation "io.github.rosemoe:editor-lsp:$soraVersion"

    // these are implementation-scoped inside sora, so the app declares what it calls directly
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:1.0.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'androidx.annotation:annotation:1.9.1'

    // browser: ProxyController (proxy override for the WebView)
    implementation 'androidx.webkit:webkit:1.12.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
