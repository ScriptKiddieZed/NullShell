name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        # NOTE: app/src/main/jniLibs is intentionally not part of this repository.
        # The Kali/PRoot native runtime is a set of prebuilt Termux binaries that
        # must be generated on-device with scripts/prepare-proot-from-termux.sh
        # (see README.md). This workflow therefore verifies that the app compiles
        # and packages correctly; the resulting APK has no bundled native runtime
        # and will not be able to start a Kali session until those files are added.
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nullshell-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
